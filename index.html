<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mini App Test</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      gap: 20px;
      /* Отступ между элементами */
    }

    button {
      padding: 12px 24px;
      background-color: var(--tg-theme-button-color, #3390ec);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 80%;
    }

    button.secondary {
      background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
      color: var(--tg-theme-text-color, #000000);
    }
  </style>
</head>

<body>
  <h1 id="greeting">Привет!</h1>

  <!-- Новая кнопка для отправки данных в бота -->
  <button id="sendDataBtn">Отправить "Привет из Mini App" в бота</button>

  <button id="closeBtn" class="secondary">Просто закрыть</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('greeting').innerText = `Привет, ${user.first_name}!`;
    }

    // Логика отправки данных в бота
    document.getElementById('sendDataBtn').addEventListener('click', () => {
      // Отправляем строку данных обратно в Telegram
      tg.sendData("Пользователь нажал кнопку в Mini App!");
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      tg.close();
    });
  </script>
</body>

</html>
