<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mini App Test</title>
  <!-- Подключение скрипта Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    button {
      padding: 12px 24px;
      background-color: var(--tg-theme-button-color, #3390ec);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1 id="greeting">Привет!</h1>
  <button id="closeBtn">Закрыть приложение</button>

  <script>
    // Инициализация Telegram Web App
    const tg = window.Telegram.WebApp;

    // Сообщаем Telegram, что приложение готово
    tg.ready();

    // Разворачиваем на весь экран
    tg.expand();

    // Получаем имя пользователя, если доступно
    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('greeting').innerText = `Привет, ${user.first_name}!`;
    }

    // Обработка кнопки закрытия
    document.getElementById('closeBtn').addEventListener('click', () => {
      tg.close();
    });
  </script>
</body>

</html>
